[package]
name = "zapfetch"
version = "0.1.0"
edition = "2021"
license = "MIT"
homepage = "https://zapfetch.com/"
repository = "https://github.com/zapfetch/sdks"
description = "Official Rust SDK for the ZapFetch v2 web scraping API."
authors = ["ZapFetch <hello@zapfetch.com>"]
keywords = ["zapfetch", "web-scraping", "crawling", "api"]
categories = ["api-bindings", "web-programming"]

[lib]
path = "src/lib.rs"
name = "zapfetch"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
thiserror = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
mockito = "1.7"
serde_json = "1"

[[example]]
name = "scrape"
path = "examples/scrape.rs"

[[example]]
name = "crawl"
path = "examples/crawl.rs"

[[example]]
name = "search"
path = "examples/search.rs"

[[example]]
name = "map"
path = "examples/map.rs"

[[example]]
name = "batch_scrape"
path = "examples/batch_scrape.rs"

[[example]]
name = "agent"
path = "examples/agent.rs"
