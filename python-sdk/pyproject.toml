[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "zapfetch-py"
description = "Official Python SDK for the ZapFetch v2 web scraping API."
readme = {file="README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
dependencies = [
    "requests",
    "httpx",
    "python-dotenv",
    "websockets",
    "nest-asyncio",
    "pydantic>=2.0",
    "aiohttp"
]
authors = [{name = "ZapFetch", email = "hello@zapfetch.com"}]
maintainers = [{name = "ZapFetch", email = "hello@zapfetch.com"}]
license = {text = "MIT License"}

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Indexing",
]

keywords = ["SDK", "API", "zapfetch", "web-scraping", "crawling"]

[project.urls]
"Documentation" = "https://docs.zapfetch.com"
"Source" = "https://github.com/zapfetch/sdks"
"Tracker" = "https://github.com/zapfetch/sdks/issues"

[tool.setuptools.packages.find]
where = ["."]
