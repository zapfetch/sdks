name: python-sdk

on:
  push:
    branches: [main]
    paths:
      - 'python-sdk/**'
      - '.github/workflows/python-sdk.yml'
  pull_request:
    paths:
      - 'python-sdk/**'
      - '.github/workflows/python-sdk.yml'

defaults:
  run:
    working-directory: python-sdk

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python-sdk/pyproject.toml

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Import smoke test
        run: python -c "import zapfetch; print('version', zapfetch.__version__); print(sorted(zapfetch.__all__))"

      - name: pytest
        run: pytest zapfetch/__tests__/unit/ tests/ -q
