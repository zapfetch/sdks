# Triggered when a GitHub Release is published with a tag of the form
# `java-sdk/vX.Y.Z`. Verifies the tag matches build.gradle.kts, runs
# tests, then publishes to Maven Central via Sonatype Central Portal.
#
# Required repo secrets:
#   MAVEN_CENTRAL_USERNAME            Sonatype user token username
#   MAVEN_CENTRAL_PASSWORD            Sonatype user token password
#   SIGNING_IN_MEMORY_KEY             `gpg --export-secret-keys --armor <KEY_ID>`
#                                     output pasted verbatim (multi-line OK)
#   SIGNING_IN_MEMORY_KEY_PASSWORD    GPG passphrase
#
# Required environment:
#   maven-central  (Settings -> Environments -> New: maven-central,
#   add required reviewer)

name: publish-java-sdk

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'java-sdk/v')
    runs-on: ubuntu-latest
    environment: maven-central
    defaults:
      run:
        working-directory: java-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-publish-${{ hashFiles('java-sdk/**/*.gradle*', 'java-sdk/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-publish-

      - name: Verify tag version matches build.gradle.kts
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG_VERSION="${TAG_NAME#java-sdk/v}"
          CODE_VERSION=$(grep -E '^version = ' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::tag version $TAG_VERSION != code version $CODE_VERSION"
            exit 1
          fi
          echo "Verified: $TAG_VERSION"

      - name: Grant execute permission on gradlew
        run: chmod +x gradlew

      - name: Sanity tests
        run: ./gradlew test --no-daemon

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache --no-daemon
