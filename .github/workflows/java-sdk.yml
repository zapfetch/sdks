name: java-sdk

on:
  push:
    branches: [main]
    paths:
      - 'java-sdk/**'
      - '.github/workflows/java-sdk.yml'
  pull_request:
    paths:
      - 'java-sdk/**'
      - '.github/workflows/java-sdk.yml'

defaults:
  run:
    working-directory: java-sdk

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.java-version }}-${{ hashFiles('java-sdk/**/*.gradle*', 'java-sdk/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.java-version }}-

      - name: Grant execute permission on gradlew
        run: chmod +x gradlew

      - name: compileJava
        run: ./gradlew compileJava --no-daemon

      - name: test
        run: ./gradlew test --no-daemon

      - name: compileExamplesJava
        run: ./gradlew compileExamplesJava --no-daemon
